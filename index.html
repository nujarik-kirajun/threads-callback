<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Threads OAuth callback</title>
<style>
body{font:16px/1.7 system-ui,sans-serif;max-width:34em;margin:3em auto;padding:0 16px;color:#222;background:#fff}
button{font:inherit;padding:.5em 1em}
@media (prefers-color-scheme:dark){body{color:#eee;background:#111}}
</style>
</head>
<body>
<h1>認証の受け取りページ</h1>
<p>この画面が出たら、Threadsでの認証は完了しています。</p>
<ol>
<li>下のボタンでこのページのURL全体をコピーするか、アドレスバーのURLをコピーします。</li>
<li>PowerShellの入力欄に貼り付けます。<strong>チャットやSNSには貼らないでください。</strong></li>
<li>貼り付けたら、このタブを閉じます。</li>
</ol>
<p><button id="c" type="button">URLをコピー</button> <span id="m" role="status"></span></p>
<p>このページは外部と通信せず、URLの内容を保存・送信しません。</p>
<script>
document.getElementById('c').addEventListener('click',function(){
  var m=document.getElementById('m');
  navigator.clipboard.writeText(location.href).then(
    function(){m.textContent='コピーしました';},
    function(){m.textContent='コピーできません。アドレスバーから手動でコピーしてください';});
});
</script>
</body>
</html>
